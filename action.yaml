name: "KW: CloudFlare - Delete DNS Record"
description: "Removes CloudFlare DNS record"
author: "KouraWealth"

inputs:
  id:
    description: "DNS record ID"
  name:
    description: "DNS record name"
  include_prefixed:
    description: >
      Also delete companion records named "<prefix>-<name>" (live-, staging-,
      assets-, mcp-, idp-, ...). Set this when tearing down an ephemeral
      environment so secondary hostnames do not outlive the primary one.
    default: "false"
  token:
    description: "CloudFlare API token"
    required: true
  zone:
    description: "CloudFlare zone"
    required: true

runs:
  using: "node24"
  main: "main.js"

branding:
  icon: "globe"
  color: "green"
